<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Haul</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 28 24" aria-hidden="true">
      <!-- t-shirt: shoulder line, neck dip, body -->
      <path d="M2 6 L9 2 L11 5 L17 5 L19 2 L26 6 L23 10 L21 9 L21 22 L7 22 L7 9 L5 10 Z"
            fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="miter" stroke-linecap="square"/>
    </svg>
    <span class="logo-text">HAUL</span>
    <svg class="logo-icon" viewBox="0 0 32 24" aria-hidden="true">
      <!-- sneaker side profile -->
      <path d="M2 16 L2 19 L30 19 L30 16 L26 14 L20 13 L15 9 L11 9 L11 13 L7 14 L2 14 Z"
            fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="miter" stroke-linecap="square"/>
      <path d="M2 14 L30 14" fill="none" stroke="currentColor" stroke-width="1"/>
      <path d="M11 13 L15 13 M13 9 L13 13" fill="none" stroke="currentColor" stroke-width="1"/>
    </svg>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="catalog">Catalog</button>
    <button class="tab" data-view="wishlist">Haul <span id="wishlist-count" class="badge"></span></button>
    <button class="tab" data-view="notes">Notes</button>
  </nav>
  <nav class="filters" id="filters"></nav>
  <nav class="filters owners" id="owner-filters"></nav>
  <nav class="view-toggle" id="view-toggle">
    <button data-mode="grid" class="active">Grid</button>
    <button data-mode="list">List</button>
    <button data-mode="compact">Compact</button>
  </nav>
  <nav class="sort-control" id="sort-control">
    <label for="sort-by">Sort:</label>
    <select id="sort-by">
      <option value="default">Default</option>
      <option value="price-desc">Price ↓ (high → low)</option>
      <option value="price-asc">Price ↑ (low → high)</option>
    </select>
    <label class="oos-toggle" title="Hidden by default. Items in your Haul stay visible regardless.">
      <input type="checkbox" id="show-oos" />
      <span>Show out-of-stock / skipped</span>
      <span class="oos-count" id="oos-count"></span>
    </label>
  </nav>
  <nav class="bulk-actions" id="bulk-actions">
    <button id="select-all" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M3 8l3 3 7-7-1.4-1.4L6 8.2 4.4 6.6z"/></svg>
      Select all
    </button>
    <button id="clear-selection" class="btn">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Clear
    </button>
    <button id="export-wishlist" class="btn ghost" title="Download your favorites as a JSON file you can re-import on another device">Export</button>
    <button id="import-wishlist" class="btn ghost" title="Restore a wishlist from a JSON file">Import</button>
    <input type="file" id="import-wishlist-input" accept=".json" style="display:none">
  </nav>
</header>

<main>
  <div class="container">
    <div id="grid" class="grid"></div>
    <div id="list" class="list hidden"></div>
    <div id="compact" class="compact hidden"></div>
    <div id="notes" class="notes hidden"></div>
  </div>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <button id="modal-close" class="close" aria-label="Close">×</button>
  <div class="modal-inner">
    <section class="hero"><img id="hero-img" alt="" /></section>
    <aside class="meta">
      <p class="m-brand" id="m-brand"></p>
      <h2 id="m-title"></h2>
      <p class="m-sub" id="m-translated"></p>
      <p class="m-price" id="m-price"></p>
      <dl id="m-dl"></dl>
      <div id="m-sizechart"></div>
      <p id="m-desc" class="m-desc"></p>
      <a id="m-link" target="_blank" rel="noopener">View on source ↗</a>
    </aside>
    <section class="thumbs" id="m-thumbs"></section>
  </div>
</div>

<script src="markdown.js"></script>
<script src="shipping.js"></script>
<script src="app.js"></script>
</body>
</html>
